version: "3.8"
services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock  # Use host Docker
      - ./python-ci-cd-jenkins:/home/jenkins/workspace/python-ci-cd-jenkins
    networks:
      - jenkins

volumes:
  jenkins_home:

networks:
  jenkins: